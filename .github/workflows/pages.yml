name: Deploy to GitHub Pages

# The game is a static ES-module app — no build step, no dependencies.
# This uploads the repo as-is and publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # NOTE: Pages must be switched on once by hand —
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The default GITHUB_TOKEN is not allowed to create a Pages site
      # ("Resource not accessible by integration"), so enablement: true fails.
      # Once Pages is on, every push to main deploys automatically.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
